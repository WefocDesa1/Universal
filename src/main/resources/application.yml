spring:
  application:
    name: xubio-sync

  datasource:
    url: jdbc:postgresql://trolley.proxy.rlwy.net:11598/railway
    username: postgres
    password: cMsOSZfQiefwWWfksSiaqcjihcJFmpnb
    driver-class-name: org.postgresql.Driver
    liquibase:
      enabled: true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase maneja el schema, Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  cloud:
    openfeign:
      okhttp:
        enabled: false
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 300000
          xubio-client:
            connectTimeout: 10000
            readTimeout: 300000

# ─────────────────────────────────────────────
# APIs externas
# ─────────────────────────────────────────────
xubio:
  api:
    base-url: https://xubio.com/API/1.1
    client-id: ${XUBIO_CLIENT_ID:166595643048938330811999560100413443433699309390229770626848980369153393578787643048166595346547233919}
    client-secret: ${XUBIO_CLIENT_SECRET:i+yG*aXcwzK5hdE1z8bow-yxyzJ18jIJiVO/meoldkFF0yFfaxz6H1CEoh8Gh2ThMqaXipxo+lXcbJVWAokV/BXRwbrMMaKVLQlwh/bsUi+yG*aXcwzK5hdE1z8bow-yxyz}
    token-url: https://xubio.com/API/1.1/TokenEndpoint
    connect-timeout: 10000
    read-timeout: 300000

uappin:
  sftp:
    host: ${UAPPIN_SFTP_HOST:}
    port: ${UAPPIN_SFTP_PORT:22}
    username: ${UAPPIN_SFTP_USERNAME:}
    private-key: ${UAPPIN_SFTP_PRIVATE_KEY:}
    inbox-path: ${UAPPIN_SFTP_INBOX_PATH:/upload/inbox}
    procesados-path: ${UAPPIN_SFTP_PROCESADOS_PATH:/upload/procesados}
    error-path: ${UAPPIN_SFTP_ERROR_PATH:/upload/error}
    connect-timeout: 10000

# ─────────────────────────────────────────────
# Schedulers (cron expressions)
# ─────────────────────────────────────────────
scheduler:
  uappin:
    servicios:
      enabled: false               # activar (o setear SCHEDULER_UAPPIN_SERVICIOS_ENABLED=true) una vez que el SFTP esté configurado
      cron: "0 0 4 * * *"          # todos los días a las 4am, después de los de Xubio
  xubio:
    facturas:
      enabled: false
      cron: "0 0 2 * * *"         # sin scheduler propio implementado, queda deshabilitado
    proveedores:
      enabled: true
      cron: "0 30 1 * * *"        # todos los días a la 1:30am (listado completo)
    clientes:
      enabled: true
      cron: "0 0 2 * * *"         # todos los días a las 2am (listado completo)
    comprobanteVenta:
      enabled: true
      cron: "0 15 2 * * *"        # todos los días a las 2:15am (últimos 4 días)
    comprobanteCompra:
      enabled: true
      cron: "0 30 2 * * *"        # todos los días a las 2:30am (últimos 4 días)
    cobranzas:
      enabled: true
      cron: "0 45 2 * * *"        # todos los días a las 2:45am (últimos 4 días)
    pagos:
      enabled: true
      cron: "0 0 3 * * *"         # todos los días a las 3am (últimos 4 días)

# ─────────────────────────────────────────────
# Retry
# ─────────────────────────────────────────────
retry:
  max-attempts: 3
  initial-interval: 2000
  multiplier: 2.0
  max-interval: 10000

# ─────────────────────────────────────────────
# Actuator
# ─────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,scheduledtasks
  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

logging:
  level:
    com.sync: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  file:
    name: logs/sync-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
