spring:
  application:
    name: xubio-sync

  datasource:
    url: jdbc:postgresql://trolley.proxy.rlwy.net:11598/railway
    username: postgres
    password: cMsOSZfQiefwWWfksSiaqcjihcJFmpnb
    driver-class-name: org.postgresql.Driver
    liquibase:
      enabled: true
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Liquibase maneja el schema, Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  cloud:
    openfeign:
      okhttp:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 300000
          xubio-client:
            connectTimeout: 10000
            readTimeout: 300000

# ─────────────────────────────────────────────
# APIs externas
# ─────────────────────────────────────────────
